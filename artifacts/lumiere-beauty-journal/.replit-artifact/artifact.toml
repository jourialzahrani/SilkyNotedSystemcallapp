kind = "web"
previewPath = "/"
title = "Lumière Beauty Journal"
description = "A bilingual Arabic and English beauty journal with editorial makeup, skincare, and beauty guidance."
version = "1.0.0"
id = "artifacts/lumiere-beauty-journal"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22860

[services.development]
run = "pnpm --filter @workspace/lumiere-beauty-journal run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/lumiere-beauty-journal", "run", "build" ]
serve = "static"
publicDir = "artifacts/lumiere-beauty-journal/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22860"
BASE_PATH = "/"
